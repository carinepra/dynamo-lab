# ═══════════════════════════════════════════════════════════════════
# CONFIGURAÇÕES DO BACKEND - AURORA DYNAMODB QUEST
# Copie para config.yaml e configure suas chaves
# ═══════════════════════════════════════════════════════════════════

openai:
  api_key: "<sua-chave-openai>"
  model: "gpt-4"  # ou gpt-3.5-turbo para economia

dynamodb:
  endpoint: "http://localhost:17000"
  region: "us-east-1"
  table_name: "aurora-benefits"

api:
  host: "0.0.0.0"
  port: 8080
  reload: true

database:
  path: "data/quiz.db"

questions:
  file: "data/questions.yaml"

logging:
  level: "INFO"

