<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <defs>
    <!-- 1. TORRE AURORA (substitui 🏰) -->
    <symbol id="icon-castle" viewBox="0 0 64 64">
      <g>
        <!-- Base da torre -->
        <rect x="12" y="38" width="40" height="26" fill="#002740" rx="2"/>
        <!-- Torre esquerda -->
        <rect x="16" y="20" width="12" height="44" fill="#124666" rx="2"/>
        <polygon points="16,20 22,12 28,20" fill="#001a2e"/>
        <!-- Torre central (maior) -->
        <rect x="26" y="10" width="12" height="54" fill="#002740" rx="2"/>
        <polygon points="26,10 32,2 38,10" fill="#001a2e"/>
        <!-- Torre direita -->
        <rect x="36" y="20" width="12" height="44" fill="#124666" rx="2"/>
        <polygon points="36,20 42,12 48,20" fill="#001a2e"/>
        <!-- Janelas iluminadas (cristais de dados) -->
        <rect x="29" y="18" width="6" height="8" fill="#67d2df" opacity="0.8" rx="1"/>
        <rect x="29" y="30" width="6" height="8" fill="#67d2df" opacity="0.7" rx="1"/>
        <rect x="29" y="42" width="6" height="8" fill="#67d2df" opacity="0.6" rx="1"/>
        <rect x="19" y="28" width="6" height="6" fill="#67d2df" opacity="0.6" rx="1"/>
        <rect x="39" y="28" width="6" height="6" fill="#67d2df" opacity="0.6" rx="1"/>
        <!-- Portão -->
        <rect x="28" y="52" width="8" height="12" rx="4" fill="#001a2e"/>
        <!-- Detalhe Aurora no topo no topo -->
        <circle cx="32" cy="6" r="2.5" fill="#67d2df" opacity="0.9"/>
      </g>
    </symbol>

    <!-- 2. GRIMÓRIO DE DADOS (substitui 📚) -->
    <symbol id="icon-book" viewBox="0 0 64 64">
      <g>
        <!-- Livro base -->
        <rect x="14" y="12" width="36" height="40" fill="#67d2df" rx="2"/>
        <rect x="16" y="14" width="32" height="36" fill="#e6f9ff" rx="1"/>
        <!-- Lombada -->
        <rect x="14" y="12" width="4" height="40" fill="#4fb9c6"/>
        <!-- Páginas abertas -->
        <path d="M 20 20 Q 32 18 44 20 L 44 44 Q 32 42 20 44 Z" fill="#ffffff" stroke="#002740" stroke-width="1"/>
        <!-- Símbolos de database -->
        <ellipse cx="28" cy="28" rx="4" ry="2" fill="#002740" opacity="0.6"/>
        <ellipse cx="28" cy="32" rx="4" ry="2" fill="#002740" opacity="0.6"/>
        <line x1="24" y1="28" x2="24" y2="32" stroke="#002740" stroke-width="0.5" opacity="0.6"/>
        <line x1="32" y1="28" x2="32" y2="32" stroke="#002740" stroke-width="0.5" opacity="0.6"/>
        <!-- Texto decorativo -->
        <line x1="36" y1="26" x2="42" y2="26" stroke="#002740" stroke-width="1" opacity="0.3"/>
        <line x1="36" y1="30" x2="42" y2="30" stroke="#002740" stroke-width="1" opacity="0.3"/>
        <line x1="36" y1="34" x2="40" y2="34" stroke="#002740" stroke-width="1" opacity="0.3"/>
      </g>
    </symbol>

    <!-- 3. CRISTAL DE MISSÃO (substitui 🎯) -->
    <symbol id="icon-crystal" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="crystalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#67d2df;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#4fb9c6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#a259ff;stop-opacity:0.8" />
        </linearGradient>
      </defs>
      <g>
        <!-- Cristal hexagonal -->
        <polygon points="32,8 48,22 48,42 32,56 16,42 16,22" fill="url(#crystalGradient)" opacity="0.9"/>
        <!-- Facetas internas -->
        <polygon points="32,8 32,32 48,22" fill="#ffffff" opacity="0.15"/>
        <polygon points="32,8 32,32 16,22" fill="#ffffff" opacity="0.25"/>
        <polygon points="32,56 32,32 48,42" fill="#002740" opacity="0.15"/>
        <polygon points="32,56 32,32 16,42" fill="#002740" opacity="0.25"/>
        <!-- Brilho central -->
        <circle cx="32" cy="32" r="6" fill="#ffffff" opacity="0.6"/>
        <circle cx="32" cy="32" r="3" fill="#f9e27d" opacity="0.8"/>
        <!-- Bordas -->
        <polygon points="32,8 48,22 48,42 32,56 16,42 16,22" fill="none" stroke="#002740" stroke-width="1.5" opacity="0.3"/>
      </g>
    </symbol>

    <!-- 4. ESPADA DE CÓDIGO (substitui ⚔️) -->
    <symbol id="icon-sword" viewBox="0 0 64 64">
      <g transform="rotate(-45 32 32)">
        <!-- Lâmina -->
        <rect x="28" y="8" width="8" height="36" fill="#67d2df" rx="1"/>
        <polygon points="28,8 32,4 36,8" fill="#4fb9c6"/>
        <!-- Símbolos de código na lâmina -->
        <text x="32" y="20" font-size="8" fill="#002740" text-anchor="middle" opacity="0.5" font-family="monospace">&lt;/&gt;</text>
        <text x="32" y="32" font-size="8" fill="#002740" text-anchor="middle" opacity="0.5" font-family="monospace">{}</text>
        <!-- Guarda -->
        <rect x="22" y="42" width="20" height="4" fill="#f9e27d" rx="1"/>
        <!-- Punho -->
        <rect x="28" y="46" width="8" height="10" fill="#002740" rx="1"/>
        <circle cx="32" cy="52" r="2" fill="#f9e27d"/>
        <!-- Pomo -->
        <circle cx="32" cy="58" r="3" fill="#f9e27d"/>
        <!-- Brilho -->
        <rect x="29" y="12" width="2" height="28" fill="#ffffff" opacity="0.3"/>
      </g>
    </symbol>

    <!-- 5. AVATAR AVENTUREIRO (substitui 👤) -->
    <symbol id="icon-avatar" viewBox="0 0 64 64">
      <g>
        <!-- Círculo base -->
        <circle cx="32" cy="32" r="24" fill="#e6f9ff"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="#67d2df" stroke-width="2"/>
        <!-- Cabeça -->
        <circle cx="32" cy="26" r="8" fill="#002740"/>
        <!-- Capacete/Elmo -->
        <path d="M 24 24 Q 32 18 40 24" fill="#67d2df" opacity="0.8"/>
        <circle cx="32" cy="22" r="2" fill="#f9e27d"/>
        <!-- Corpo (escudo) -->
        <path d="M 32 34 L 24 38 L 24 46 L 32 50 L 40 46 L 40 38 Z" fill="#002740"/>
        <path d="M 32 34 L 32 50" stroke="#67d2df" stroke-width="2"/>
        <path d="M 24 38 L 40 38" stroke="#67d2df" stroke-width="2"/>
        <!-- Detalhe: símbolo no escudo -->
        <circle cx="32" cy="42" r="3" fill="#67d2df" opacity="0.6"/>
      </g>
    </symbol>

    <!-- 6. FERRAMENTA TECH (substitui ⚙️) -->
    <symbol id="icon-gear" viewBox="0 0 64 64">
      <g>
        <!-- Engrenagem base -->
        <circle cx="32" cy="32" r="16" fill="#002740"/>
        <circle cx="32" cy="32" r="12" fill="#124666"/>
        <!-- Dentes da engrenagem -->
        <rect x="30" y="12" width="4" height="6" fill="#002740" rx="1"/>
        <rect x="30" y="46" width="4" height="6" fill="#002740" rx="1"/>
        <rect x="12" y="30" width="6" height="4" fill="#002740" rx="1"/>
        <rect x="46" y="30" width="6" height="4" fill="#002740" rx="1"/>
        <rect x="18" y="18" width="5" height="5" fill="#002740" rx="1" transform="rotate(45 20.5 20.5)"/>
        <rect x="41" y="18" width="5" height="5" fill="#002740" rx="1" transform="rotate(-45 43.5 20.5)"/>
        <rect x="18" y="41" width="5" height="5" fill="#002740" rx="1" transform="rotate(-45 20.5 43.5)"/>
        <rect x="41" y="41" width="5" height="5" fill="#002740" rx="1" transform="rotate(45 43.5 43.5)"/>
        <!-- Centro com símbolo de código -->
        <circle cx="32" cy="32" r="8" fill="#67d2df"/>
        <text x="32" y="36" font-size="8" fill="#002740" text-anchor="middle" font-weight="bold" font-family="monospace">&lt;/&gt;</text>
      </g>
    </symbol>

    <!-- 7. PERGAMINHO QUEST (substitui 🗺️) -->
    <symbol id="icon-map" viewBox="0 0 64 64">
      <g>
        <!-- Pergaminho -->
        <rect x="12" y="16" width="40" height="32" fill="#f9e27d" rx="2"/>
        <!-- Textura do pergaminho -->
        <rect x="14" y="18" width="36" height="28" fill="#fef5d4" rx="1"/>
        <!-- Bordas enroladas -->
        <ellipse cx="32" cy="16" rx="20" ry="4" fill="#f9e27d"/>
        <ellipse cx="32" cy="48" rx="20" ry="4" fill="#f9e27d"/>
        <!-- Rota da quest -->
        <circle cx="20" cy="26" r="2" fill="#002740" opacity="0.6"/>
        <line x1="22" y1="26" x2="30" y2="32" stroke="#002740" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
        <circle cx="32" cy="32" r="2" fill="#67d2df" opacity="0.8"/>
        <line x1="34" y1="32" x2="42" y2="38" stroke="#002740" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
        <circle cx="44" cy="38" r="2" fill="#002740" opacity="0.6"/>
        <!-- Símbolo de destino -->
        <path d="M 44 38 L 46 34 L 48 38 L 44 38" fill="#67d2df" opacity="0.8"/>
        <!-- Detalhes decorativos -->
        <line x1="18" y1="24" x2="22" y2="24" stroke="#002740" stroke-width="0.5" opacity="0.3"/>
        <line x1="18" y1="40" x2="28" y2="40" stroke="#002740" stroke-width="0.5" opacity="0.3"/>
      </g>
    </symbol>

    <!-- 8. CRISTAL DE ENERGIA (substitui ⚡) -->
    <symbol id="icon-energy" viewBox="0 0 64 64">
      <defs>
        <radialGradient id="energyGlow">
          <stop offset="0%" style="stop-color:#67d2df;stop-opacity:1" />
          <stop offset="50%" style="stop-color:#67d2df;stop-opacity:0.6" />
          <stop offset="100%" style="stop-color:#67d2df;stop-opacity:0" />
        </radialGradient>
      </defs>
      <g>
        <!-- Glow externo -->
        <circle cx="32" cy="32" r="20" fill="url(#energyGlow)" opacity="0.6"/>
        <!-- Cristal principal -->
        <polygon points="32,14 42,28 38,32 42,44 32,50 22,44 26,32 22,28" fill="#67d2df"/>
        <!-- Facetas de luz -->
        <polygon points="32,14 38,28 32,32" fill="#ffffff" opacity="0.4"/>
        <polygon points="32,14 26,28 32,32" fill="#ffffff" opacity="0.3"/>
        <polygon points="32,50 38,36 32,32" fill="#002740" opacity="0.2"/>
        <!-- Núcleo brilhante -->
        <circle cx="32" cy="32" r="4" fill="#ffffff" opacity="0.9"/>
        <circle cx="32" cy="32" r="2" fill="#f9e27d"/>
        <!-- Partículas ao redor -->
        <circle cx="24" cy="20" r="1.5" fill="#67d2df" opacity="0.8"/>
        <circle cx="40" cy="24" r="1" fill="#67d2df" opacity="0.6"/>
        <circle cx="44" cy="36" r="1.5" fill="#67d2df" opacity="0.7"/>
        <circle cx="20" cy="40" r="1" fill="#67d2df" opacity="0.6"/>
        <circle cx="28" cy="48" r="1.5" fill="#67d2df" opacity="0.8"/>
      </g>
    </symbol>

    <!-- 9. PYTHON - Serpente Mágica -->
    <symbol id="icon-python" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="pythonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#67d2df;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#4fb9c6;stop-opacity:1" />
        </linearGradient>
      </defs>
      <g>
        <!-- Corpo da serpente estilizada -->
        <path d="M 20 40 Q 20 20 32 20 Q 44 20 44 32 Q 44 44 32 44 Q 26 44 26 38" fill="none" stroke="url(#pythonGrad)" stroke-width="6" stroke-linecap="round"/>
        <!-- Cabeça -->
        <circle cx="20" cy="40" r="8" fill="url(#pythonGrad)"/>
        <circle cx="18" cy="38" r="2" fill="#f9e27d"/>
        <!-- Cristais de dados -->
        <circle cx="32" cy="20" r="3" fill="#f9e27d" opacity="0.8"/>
        <circle cx="44" cy="32" r="3" fill="#f9e27d" opacity="0.8"/>
        <!-- Detalhe tech -->
        <circle cx="32" cy="32" r="4" fill="#002740" opacity="0.3"/>
        <text x="32" y="36" font-size="6" fill="#ffffff" text-anchor="middle" font-family="monospace">py</text>
      </g>
    </symbol>

    <!-- 10. GO - Gopher Guerreiro -->
    <symbol id="icon-go" viewBox="0 0 64 64">
      <g>
        <!-- Escudo hexagonal (Go gopher style) -->
        <polygon points="32,12 48,22 48,42 32,52 16,42 16,22" fill="#67d2df" opacity="0.9"/>
        <polygon points="32,12 48,22 48,42 32,52 16,42 16,22" fill="none" stroke="#002740" stroke-width="2"/>
        <!-- Rosto do gopher estilizado -->
        <circle cx="26" cy="28" r="3" fill="#002740"/>
        <circle cx="38" cy="28" r="3" fill="#002740"/>
        <!-- Dentes característicos -->
        <rect x="28" y="36" width="3" height="4" fill="#ffffff"/>
        <rect x="33" y="36" width="3" height="4" fill="#ffffff"/>
        <!-- Cristal de código -->
        <circle cx="32" cy="20" r="2" fill="#f9e27d"/>
        <!-- Símbolos Go -->
        <text x="32" y="50" font-size="8" fill="#002740" text-anchor="middle" font-weight="bold" font-family="monospace">go</text>
      </g>
    </symbol>

    <!-- 11. JAVASCRIPT - Cristal de Código -->
    <symbol id="icon-javascript" viewBox="0 0 64 64">
      <defs>
        <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#f9e27d;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#e6c84f;stop-opacity:1" />
        </linearGradient>
      </defs>
      <g>
        <!-- Livro/Pergaminho de código -->
        <rect x="16" y="16" width="32" height="32" fill="url(#jsGrad)" rx="3"/>
        <rect x="18" y="18" width="28" height="28" fill="#fef5d4" rx="2"/>
        <!-- Símbolos JS -->
        <text x="32" y="36" font-size="16" fill="#002740" text-anchor="middle" font-weight="bold" font-family="monospace">JS</text>
        <!-- Chaves de código -->
        <text x="24" y="28" font-size="10" fill="#67d2df" text-anchor="middle" opacity="0.6" font-family="monospace">{</text>
        <text x="40" y="28" font-size="10" fill="#67d2df" text-anchor="middle" opacity="0.6" font-family="monospace">}</text>
        <!-- Detalhe de cristal -->
        <circle cx="32" cy="12" r="2" fill="#67d2df" opacity="0.8"/>
      </g>
    </symbol>
  </defs>
</svg>

